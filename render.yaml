# Render Blueprint — PRODUCTION spec: always-on Starter instance + a persistent
# disk so data (stations, documents, service log, backups) never resets.
#
# Deploy: Render -> New + -> Blueprint -> connect this repo -> it reads this file.
# You'll be asked for SEED_PASSWORD (your first login password). Starter + disk
# require a payment method (~$7/mo instance + ~$0.25/GB-mo disk).
#
# To run a free trial instead (data resets on sleep): set `plan: free` and remove
# the `disk:` block and the DB_PATH/UPLOAD_DIR/BACKUP_DIR vars.

services:
  - type: web
    name: moov-service-network
    runtime: node
    plan: starter
    buildCommand: npm run setup && npm run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeploy: true            # redeploys automatically when you push to the branch
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET          # auto-generated strong secret, kept stable
        generateValue: true
      - key: SEED_PASSWORD       # your initial login password (set on first deploy)
        sync: false
      # Keep the database, uploaded documents, and backups on the persistent disk.
      - key: DB_PATH
        value: /var/data/servicemap.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
