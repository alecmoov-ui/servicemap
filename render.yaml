# Render Blueprint — PRODUCTION: always-on Starter instance + a persistent disk so
# data (stations, documents, service log, backups) never resets.
#
# To run free again (data resets): set `plan: free`, and remove the `disk:` block and
# the DB_PATH / UPLOAD_DIR / BACKUP_DIR env vars.

services:
  - type: web
    name: moov-service-network
    runtime: node
    plan: starter
    buildCommand: npm run setup && npm run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET          # auto-generated strong secret, kept stable
        generateValue: true
      - key: SEED_PASSWORD       # your initial login password (set on first deploy)
        sync: false
      # Keep the database, uploaded documents, and backups on the persistent disk.
      - key: DB_PATH
        value: /var/data/servicemap.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
