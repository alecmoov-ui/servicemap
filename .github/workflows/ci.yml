# Runs on every push and pull request: installs deps, runs the backend test
# suite, and builds the client. A change that breaks tests or the build fails
# here BEFORE it can be deployed — this is the automated guardrail.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client deps
        run: npm ci
      - name: Install server deps
        run: npm ci --prefix server

      - name: Run backend tests
        run: npm test --prefix server

      - name: Build client
        run: npm run build
